<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="100%" role="img" aria-label="SAF · Sistema de Agendamento de Férias: painel ilustrativo">
  <style>
    text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#dbe7f3}
    .t{font-size:26px;font-weight:700;fill:#fff}.s{font-size:15px;fill:#8fa6bd}.h{font-size:16px;font-weight:600}
    .n{font-size:30px;font-weight:700;fill:#fff}.l{font-size:13px;fill:#8fa6bd}.v{font-size:14px;font-weight:600}.m{font-family:Consolas,'Courier New',monospace;font-size:12px;fill:#6f879e}
    .bh{transform-box:fill-box;transform-origin:left;animation:cresceX 1.6s ease-out both}
    .bv{transform-box:fill-box;transform-origin:bottom;animation:cresceY 1.4s ease-out both}
    .vivo{animation:pulsa 2s ease-in-out infinite}
    @keyframes cresceX{from{transform:scaleX(0)}}@keyframes cresceY{from{transform:scaleY(0)}}@keyframes pulsa{50%{opacity:.3}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1200" height="470" rx="16" fill="#0d1b2a"/>
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="#6f7cf7"/>
  <text class="t" x="36" y="52">SAF · Sistema de Agendamento de Férias</text><text class="s" x="36" y="78">Agendamento, aprovação e acompanhamento de férias com as regras da CLT</text>
  <circle class="vivo" cx="1050" cy="46" r="6" fill="#3fb950"/><text class="l" x="1064" y="51">em produção</text>
  <rect x="36" y="100" width="230" height="74" rx="10" fill="#14273b"/><text class="n" x="54" y="140">6.000+</text><text class="l" x="54" y="162">colaboradores</text>
  <rect x="286" y="100" width="230" height="74" rx="10" fill="#14273b"/><text class="n" x="304" y="140">5</text><text class="l" x="304" y="162">perfis de acesso</text>
  <rect x="536" y="100" width="230" height="74" rx="10" fill="#14273b"/><text class="n" x="554" y="140">120+</text><text class="l" x="554" y="162">testes automatizados</text>
  <rect x="786" y="100" width="230" height="74" rx="10" fill="#14273b"/><text class="n" x="804" y="140">diária</text><text class="l" x="804" y="162">sincronização com o ERP</text>
  <text class="h" x="36" y="216">Solicitações por situação</text>
  <text class="l" x="36" y="253">Aprovadas</text><rect x="170" y="236" width="360" height="24" rx="6" fill="#14273b"/><rect class="bh" style="animation-delay:0.00s" x="170" y="236" width="223" height="24" rx="6" fill="#3fb950"/><text class="v" x="542" y="253">62%</text>
  <text class="l" x="36" y="293">Pendentes</text><rect x="170" y="276" width="360" height="24" rx="6" fill="#14273b"/><rect class="bh" style="animation-delay:0.15s" x="170" y="276" width="83" height="24" rx="6" fill="#e3b341"/><text class="v" x="542" y="293">23%</text>
  <text class="l" x="36" y="333">Recusadas</text><rect x="170" y="316" width="360" height="24" rx="6" fill="#14273b"/><rect class="bh" style="animation-delay:0.30s" x="170" y="316" width="29" height="24" rx="6" fill="#f85149"/><text class="v" x="542" y="333">8%</text>
  <text class="l" x="36" y="373">Canceladas</text><rect x="170" y="356" width="360" height="24" rx="6" fill="#14273b"/><rect class="bh" style="animation-delay:0.45s" x="170" y="356" width="25" height="24" rx="6" fill="#8b949e"/><text class="v" x="542" y="373">7%</text>
  <text class="h" x="640" y="216">Férias por mês</text><line x1="640" y1="410" x2="1164" y2="410" stroke="#29425c"/>
  <rect class="bv" style="animation-delay:0.00s" x="648" y="346" width="28" height="64" rx="4" fill="#6f7cf7"/><text class="l" x="662" y="430" text-anchor="middle">Jan</text><text class="v" x="662" y="338" text-anchor="middle">18</text>
  <rect class="bv" style="animation-delay:0.08s" x="692" y="331" width="28" height="79" rx="4" fill="#6f7cf7"/><text class="l" x="706" y="430" text-anchor="middle">Fev</text><text class="v" x="706" y="323" text-anchor="middle">22</text>
  <rect class="bv" style="animation-delay:0.16s" x="735" y="299" width="28" height="111" rx="4" fill="#6f7cf7"/><text class="l" x="749" y="430" text-anchor="middle">Mar</text><text class="v" x="749" y="291" text-anchor="middle">31</text>
  <rect class="bv" style="animation-delay:0.24s" x="779" y="367" width="28" height="43" rx="4" fill="#6f7cf7"/><text class="l" x="793" y="430" text-anchor="middle">Abr</text><text class="v" x="793" y="359" text-anchor="middle">12</text>
  <rect class="bv" style="animation-delay:0.32s" x="823" y="378" width="28" height="32" rx="4" fill="#6f7cf7"/><text class="l" x="836" y="430" text-anchor="middle">Mai</text><text class="v" x="836" y="370" text-anchor="middle">9</text>
  <rect class="bv" style="animation-delay:0.40s" x="866" y="360" width="28" height="50" rx="4" fill="#6f7cf7"/><text class="l" x="880" y="430" text-anchor="middle">Jun</text><text class="v" x="880" y="352" text-anchor="middle">14</text>
  <rect class="bv" style="animation-delay:0.48s" x="910" y="274" width="28" height="136" rx="4" fill="#6f7cf7"/><text class="l" x="924" y="430" text-anchor="middle">Jul</text><text class="v" x="924" y="266" text-anchor="middle">38</text>
  <rect class="bv" style="animation-delay:0.56s" x="954" y="353" width="28" height="57" rx="4" fill="#6f7cf7"/><text class="l" x="968" y="430" text-anchor="middle">Ago</text><text class="v" x="968" y="345" text-anchor="middle">16</text>
  <rect class="bv" style="animation-delay:0.64s" x="997" y="371" width="28" height="39" rx="4" fill="#6f7cf7"/><text class="l" x="1011" y="430" text-anchor="middle">Set</text><text class="v" x="1011" y="363" text-anchor="middle">11</text>
  <rect class="bv" style="animation-delay:0.72s" x="1041" y="364" width="28" height="46" rx="4" fill="#6f7cf7"/><text class="l" x="1055" y="430" text-anchor="middle">Out</text><text class="v" x="1055" y="356" text-anchor="middle">13</text>
  <rect class="bv" style="animation-delay:0.80s" x="1085" y="339" width="28" height="71" rx="4" fill="#6f7cf7"/><text class="l" x="1098" y="430" text-anchor="middle">Nov</text><text class="v" x="1098" y="331" text-anchor="middle">20</text>
  <rect class="bv" style="animation-delay:0.88s" x="1128" y="260" width="28" height="150" rx="4" fill="#6f7cf7"/><text class="l" x="1142" y="430" text-anchor="middle">Dez</text><text class="v" x="1142" y="252" text-anchor="middle">42</text>
  <text class="m" x="36" y="452">painel ilustrativo · dados fictícios</text>
</svg>
